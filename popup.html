<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>TweetDeck Classic UI</title>
<style>
  body {
    width: 240px;
    margin: 0;
    padding: 14px;
    font-family: "Helvetica Neue", Helvetica, Arial, "Malgun Gothic", sans-serif;
    background: #15202b;
    color: #d9d9d9;
  }
  h1 {
    font-size: 13px;
    margin: 0 0 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #1da1f2;
  }
  label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    cursor: pointer;
  }
  p {
    font-size: 11px;
    color: #8899a6;
    line-height: 1.5;
    margin: 10px 0 0;
  }
</style>
</head>
<body>
  <h1>TweetDeck Classic UI</h1>
  <label>
    <input type="checkbox" id="toggle-enabled">
    이 사이트에서 켜기
  </label>
  <p>x.com / twitter.com 화면을 예전 트윗덱처럼 어둡고 촘촘한 컬럼형 디자인으로 바꿉니다. 새로고침하면 바로 반영됩니다.</p>
</body>
<script src="popup.js"></script>
</html>
